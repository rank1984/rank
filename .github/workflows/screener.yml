name: Momentum Screener - Multi-Agent Run

on:
  schedule:
    # 21:30 UTC, ימי חול: אחרי הסגירה גם בשעון קיץ (20:00 UTC) וגם בחורף (21:00 UTC).
    # בנוסף הקוד בודק נר סגור ויום חג (status=no_new_bar), ולכן ריצה "מוקדמת" לא תיצור אותות.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      force_run:
        description: "בדיקה בלבד: עוקף בדיקת נר סגור/חג וכפילות (run_mode=force, לא נכנס לניתוח Edge)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: momentum-screener
  cancel-in-progress: false

jobs:
  run-multi-agent-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (offline, stubbed)
        continue-on-error: true   # כשל בבדיקה מופיע ב-UI אבל לא מפיל יום סריקה
        run: python scripts/run_all_tests.py

      - name: Run multi-agent screener
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_RUN: ${{ inputs.force_run && '1' || '' }}
        run: python orchestrator.py

      - name: Commit updated logs
        if: always()
        run: |
          git config user.name "momentum-bot"
          git config user.email "bot@users.noreply.github.com"
          git add logs
          git diff --staged --quiet || git commit -m "Auto: screener run $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase --autostash
          git push
